<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GYM SPACE | Bắt đầu tập luyện</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-glow"></div>

    <nav class="navbar">
        <div class="logo">GYM SPACE</div>

        <div class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Lịch tập</a>
            <a href="#">Đăng nhập</a>
        </div>
    </nav>

    <div class="container">

        <div class="profile-glow"></div>

        <h1>GYM SPACE</h1>

        <p class="subtitle">
            Bạn sẽ tập gì vào Hôm Nay?
        </p>

        <div class="spline-container">
            <p>Mô hình 3D cơ thể người sẽ hiển thị ở đây<br><span>(Nhúng mã iframe của Spline vào thẻ div này)</span></p>
        </div>

        <div class="skills">
            <span class="skill-tag">Cơ Ngực</span>
            <span class="skill-tag">Lưng / Xô</span>
            <span class="skill-tag">Cơ Vai</span>
            <span class="skill-tag">Chân / Mông</span>
        </div>

        <div class="buttons">
            <button class="primary-btn">Bắt đầu tập</button>
            <button class="secondary-btn">Xem lịch tập</button>
        </div>

        <div class="footer">
            © 2026 Văn Công Minh - Đam mê Fitness & Lập trình.
        </div>

    </div>

</body>
</html>
