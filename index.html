<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Tuyến | 2/8/2009</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="phase-1" class="phase active">
        <h2 class="question-text">Hôm nay là ngày gì thế nhỉ ????</h2>
        <p class="month-text">Tháng 7</p>
        <div class="date-roller">
            <div class="date-list" id="dateList">
                </div>
        </div>
        <p class="month-text" style="margin-top:10px;">Tháng 8</p>
    </div>
    
    <canvas id="matrixCanvas"></canvas>

    <div id="phase-3" class="phase">
        <h1 class="dotted-text">HAPPY<br>BIRTHDAY</h1>
    </div>

    <div id="phase-4" class="phase">
        <div class="rope-container">
            <svg class="rope-svg" preserveAspectRatio="none" viewBox="0 0 1000 500">
                <path class="rope-path" d="M -100,250 C 200,50 350,450 650,250 S 900,50 1200,250"></path>
            </svg>
        </div>
        
        <div class="polaroid" style="top: 15%; left: 15%; transform: rotate(-10deg);">
            <img src="tuyen1.jpg" alt="Tuyến">
            <span>Love Day 🌹</span>
        </div>
        <div class="polaroid" style="top: 45%; left: 45%; transform: rotate(8deg);">
            <img src="tuyen2.jpg" alt="Tuyến">
            <span>Cu Te Nhất</span>
        </div>
        <div class="polaroid" style="top: 25%; left: 75%; transform: rotate(-5deg);">
            <img src="tuyen3.jpg" alt="Tuyến">
            <span>2/8/2009</span>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
        // 1. SETUP ĐỒNG HỒ CUỘN
        const dates = [25, 26, 27, 28, 29, 30, 31, 1, 2];
        const dateList = document.getElementById('dateList');
        dates.forEach(d => {
            let div = document.createElement('div');
            div.className = 'date-item';
            div.innerText = d;
            dateList.appendChild(div);
        });

        setTimeout(() => {
            const itemHeight = document.querySelector('.date-item').offsetHeight;
            const targetScroll = -itemHeight * (dates.length - 1);
            
            dateList.style.transition = "top 5s cubic-bezier(0.25, 1, 0.5, 1)";
            dateList.style.top = targetScroll + 'px';

            setTimeout(() => {
                const items = document.querySelectorAll('.date-item');
                items[items.length - 1].classList.add('highlight'); 
                
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });

                setTimeout(startPhase2, 2000);
            }, 5000); 
        }, 500);

        // 2. CHUYỂN CẢNH MA TRẬN
        function startPhase2() {
            document.getElementById('phase-1').classList.remove('active');
            document.body.classList.add('black-bg'); 
            
            const matrix = document.getElementById('matrixCanvas');
            matrix.style.opacity = 1;
            initMatrix(); 

            setTimeout(startPhase3, 5000);
        }

        // 3. HIỆN CHỮ HAPPY BIRTHDAY
        function startPhase3() {
            const phase3 = document.getElementById('phase-3');
            phase3.classList.add('active');

            setTimeout(() => {
                phase3.classList.remove('active');
                setTimeout(startPhase4, 1500); 
            }, 5000);
        }

        // 4. VẼ ĐƯỜNG CONG VÀ HIỆN ẢNH
        function startPhase4() {
            document.getElementById('matrixCanvas').style.opacity = 0.2; 
            document.getElementById('phase-4').classList.add('active');

            const photos = document.querySelectorAll('.polaroid');
            photos.forEach((photo, index) => {
                setTimeout(() => {
                    const currentRotation = photo.style.transform.match(/rotate\((.*?)\)/)[0];
                    photo.style.transform = `scale(1) ${currentRotation}`;
                }, 1500 + (index * 600)); 
            });
        }

        // SỬA LỖI 2: ĐO KÍCH THƯỚC CHUẨN ĐỂ MA TRẬN KHÔNG BỊ RƠI NGANG
        function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            
            // Lấy kích thước thực tế của phần tử Body (đã bị lật) thay vì của Window
            canvas.width = document.body.clientWidth;
            canvas.height = document.body.clientHeight;

            const words = ["HAPPYBIRTHDAY", "NHKT", "VCM", "FROM VCM WITH LOVE", "KIMTUYEN"];
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = [];
            
            for(let x = 0; x < columns; x++) drops[x] = 1; 

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#f472b6'; 
                ctx.font = fontSize + 'px monospace';

                for(let i = 0; i < drops.length; i++) {
                    const randomWord = words[Math.floor(Math.random() * words.length)];
                    const text = randomWord.charAt(Math.floor(Math.random() * randomWord.length));
                    
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975)
                        drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            
            // Fix phòng trường hợp người dùng lật điện thoại sau khi load
            window.addEventListener('resize', () => {
                canvas.width = document.body.clientWidth;
                canvas.height = document.body.clientHeight;
            });
        }

        // TÍNH NĂNG ZOOM ẢNH
        const photos = document.querySelectorAll('.polaroid');
        const overlay = document.getElementById('overlay');

        photos.forEach(photo => {
            photo.addEventListener('click', function() {
                if(this.classList.contains('zoomed')) {
                    this.classList.remove('zoomed');
                    overlay.classList.remove('active');
                } else {
                    photos.forEach(p => p.classList.remove('zoomed')); 
                    this.classList.add('zoomed');
                    overlay.classList.add('active');
                }
            });
        });

        overlay.addEventListener('click', () => {
            photos.forEach(p => p.classList.remove('zoomed'));
            overlay.classList.remove('active');
        });
    </script>
</body>
</html>
